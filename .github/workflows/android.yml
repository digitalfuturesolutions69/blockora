name: Android foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned tools and verified downloads
        run: bash tools/install_ci_toolchain.sh
      - name: Validate GDScript, behavior, and bootstrap
        run: bash tools/test.sh
      - name: Compile platform spike and export test artifacts
        run: bash tools/build_android.sh
      - name: Upload test artifacts and effective manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blockora-phase0b-android
          path: |
            builds/blockora-debug.apk
            builds/blockora-test.aab
            builds/aab-manifest.xml
          if-no-files-found: error
          retention-days: 7
